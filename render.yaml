services:
  - type: web
    name: chatix-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx drizzle-kit migrate && node dist/main
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: IP_TAG_SECRET
        generateValue: true
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_REGION
        value: auto
      - key: MINIO_PUBLIC_URL_HAS_BUCKET
        value: "true"
      - key: MINIO_BUCKET_NAME
        value: chatix
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_PUBLIC_URL
        sync: false
      - key: ROOMS_AUTO_APPROVE
        value: "true"
